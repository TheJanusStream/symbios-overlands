# Cap parallel build jobs so `cargo test` doesn't link every Bevy binary at
# once. Each statically links a full Bevy app; ~32 simultaneous multi-GB links
# (the default = nproc) exhaust system RAM and destabilise the machine. The
# ceiling here is at *link* time, not test run time, so a small job count keeps
# only a few heavy links in flight.
#
# It used to be 24 test binaries — nineteen integration files with a target
# each, the lib, a harness for both bins, and the workspace members. #1179 made
# every integration file a module of one `integration` target and turned off
# the two bins' unused test harnesses, leaving three: `touch src/lib.rs &&
# cargo test --no-run` fell from 1 m 56 s to 39 s at this job count. What the
# cap still guards is the app and render bins linking beside the suite.
#
# Calibrated against fat-LTO links (~8 GB apiece). Since #1064 the suite runs
# under `[profile.test-release]`, where a link costs ~1.7 GB, so there is real
# headroom to raise this — left alone because the profile fix already removed
# the pressure that made the cap necessary. Raise it if you move to a
# higher-RAM box.
[build]
jobs = 6

# symbios-avatar pulls getrandom 0.3 transitively (symbios-texture -> rand),
# and 0.3 refuses to build for wasm32-unknown-unknown without a cfg naming
# its backend. The sibling repo carries this flag in its own .cargo config,
# but cargo configs do not propagate to dependents, so overlands must repeat
# it (#1055). The direct getrandom 0.2 + "js" dependency is a separate major
# version and coexists untouched.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
