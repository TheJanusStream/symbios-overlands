[package]
name = "gen-jobs"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic, serialisable CPU generation jobs shared by the Symbios Overlands app (native AsyncComputeTaskPool backend) and the wasm Web Worker. Depends only on the Bevy-free symbios-* cores (ground / texture / audio / avatar), never the engine."

[lib]
crate-type = ["rlib"]

[dependencies]
symbios-ground = "0.3"
symbios-texture = "0.4"
symbios-audio = "0.1"
# The avatar engine, for `GenJob::AvatarBuild` (#1061). Bevy-free by design,
# so the slim-worker constraint above holds; `serde-avatar` is what makes a
# built body serialisable across the worker boundary (symbios-avatar#234).
symbios-avatar = { version = "0.1", features = ["serde-avatar"] }
serde = { version = "1", features = ["derive"] }
# Encode the large RGBA / WAV byte buffers as compact msgpack `bin` blobs
# instead of per-element integer arrays across the wasm worker boundary (the
# worker codec is self-describing msgpack; see gen-worker). No effect on the
# native path, which runs the job without a serde round-trip.
serde_bytes = "0.11"

# `symbios-ground` pulls `rand` (default features) -> `getrandom` 0.3, which on
# wasm needs the `wasm_js` backend feature to compile (it is dead-stripped here
# since only seeded `rand_pcg` is used). In the full app `wasm-bindgen` enables
# this; for standalone builds (the slim worker) we enable it directly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
# Mirror the wasm worker's self-describing msgpack codec (see gen-worker) so the
# heightmap byte-blob round-trip is exercised against the real serialisation.
rmp-serde = "1"
