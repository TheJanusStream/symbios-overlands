[package]
name = "transform-gizmo-bevy"
description = "Overlands' copy of transform-gizmo's Bevy integration (upstream 0.11.0), carried so the Bevy upgrade need not wait for an upstream release (#1634)"
# Upstream's version, kept so the copy reads as what it was taken from; see README.md.
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Urho Laukkarinen <urho.laukkarinen@gmail.com>"]
repository = "https://github.com/urholaukkarinen/transform-gizmo"
publish = false

[features]
default = ["gizmo_picking_backend", "mouse_interaction"]
gizmo_picking_backend = ["dep:bevy_picking"]
mouse_interaction = []

[dependencies]
# The engine-agnostic core (handle geometry, hit tests, drag maths) stays on
# crates.io: it has no Bevy dependency, so no Bevy upgrade waits on it.
transform-gizmo = "0.11.0"

bevy_app = { version = "0.20.1", default-features = false }
bevy_asset = { version = "0.20.1", default-features = false }
bevy_camera = { version = "0.20.1", default-features = false }
bevy_core_pipeline = { version = "0.20.1", default-features = false }
bevy_derive = { version = "0.20.1", default-features = false }
bevy_ecs = { version = "0.20.1", default-features = false }
bevy_extract = { version = "0.20.1", default-features = false }
bevy_image = { version = "0.20.1", default-features = false }
bevy_input = { version = "0.20.1", default-features = false }
bevy_log = { version = "0.20.1", default-features = false }
bevy_math = { version = "0.20.1", default-features = false, features = ["mint"] }
bevy_mesh = { version = "0.20.1", default-features = false }
bevy_pbr = { version = "0.20.1", default-features = false }
bevy_picking = { version = "0.20.1", default-features = false, optional = true }
bevy_platform = { version = "0.20.1", default-features = false }
bevy_reflect = { version = "0.20.1", default-features = false }
bevy_render = { version = "0.20.1", default-features = false }
bevy_shader = { version = "0.20.1", default-features = false }
bevy_transform = { version = "0.20.1", default-features = false }
bevy_utils = { version = "0.20.1", default-features = false }
bevy_window = { version = "0.20.1", default-features = false }
bytemuck = "1.23"
uuid = "1.17"
