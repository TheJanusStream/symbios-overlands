[package]
name = "symbios-overlands"
version = "0.8.0"
edition = "2024"
# Targets are declared, not discovered (#1179).
#
# Every integration-test file used to be its own `[[test]]` target, and each
# one statically links the whole Bevy engine: 19 files meant 19 whole-program
# links on every `cargo test` that touched the lib, which is most of a working
# session's waiting. They are now modules of one `integration` harness - see
# `tests/main.rs` for what that changes about running them.
#
# The two binaries opt out of a TEST harness (not out of being built): neither
# carries a `#[test]`, so `cargo test` was linking two more whole engines to
# run nothing.
autotests = false
autobins = false
# `cargo run` with no `--bin` is otherwise ambiguous - the crate ships the app
# and the headless render tool - and the error it produced was the first thing
# a newcomer hit (#1162).
default-run = "symbios-overlands"

# The app is the workspace root; `crates/*` hold the Bevy-free crates shared
# with the wasm Web Worker: the compute-offload jobs (see crates/gen-jobs) and
# the geodata decoders (crates/geodata, #1580). Keeping them in one workspace
# gives a shared lockfile, target dir, and feature unification.
[workspace]
members = ["crates/gen-jobs", "crates/gen-worker", "crates/geodata", "crates/transform-gizmo-bevy"]
# Which packages a bare `cargo test` / `cargo clippy` / `cargo nextest run`
# actually selects (#1147).
#
# Without this, a non-virtual workspace selects the root package alone - so
# gen-jobs' tests ran in NO gate, local or CI. That is the crate carrying
# `GenJob::run`, whose whole contract is that native and the wasm worker
# produce byte-identical output; its determinism and msgpack round-trip
# tests are the only checks of that claim, and a regression in either would
# have shipped green to the Pages deploy.
#
# Stated as `default-members` rather than by adding `--workspace` to each
# command, so the gate is correct by default instead of correct only when
# someone remembers a flag. `gen-worker` stays out on purpose: it is a
# wasm-only binary with nothing to test on native, and the wasm check
# already says `--workspace` explicitly to cover it. The gizmo copy is in so
# fmt, clippy and the doc gate hold it to this repository's standard.
default-members = [".", "crates/gen-jobs", "crates/geodata", "crates/transform-gizmo-bevy"]

[features]
# Native allocation tracer (#811): wraps the global allocator and prints a
# backtrace for every allocation >= 16 MiB, so the per-frame giant-buffer
# churn measured on wasm can be attributed by name. Diagnostic-only - run
# `cargo run --release --features alloc-trace`, play for a minute, read
# stderr. Off by default: zero cost in normal builds.
alloc-trace = []
# The WebGPU web build (#1670): Bevy's `webgpu` feature, which overrides its
# default `webgl2` - one wasm binary is one or the other, so the deploy
# builds both and `index.html` picks one per browser. Code gates the limits
# that are WebGL2's rather than the web's on the `webgl2` cfg `build.rs`
# sets (wasm32 without this feature). Native builds ignore it.
webgpu = ["bevy/webgpu"]

[dependencies]
# Bevy without its default features (#1576): only what this crate and its
# siblings' call sites reach. Features are additive across the graph, and no
# sibling switches Bevy's defaults on, so this list is the union's floor -
# anything Overlands touches must be named here, even where a sibling or a
# Bevy crate happens to bring it along today. What goes with the defaults:
# glTF and animation, morph targets, Bevy UI, text and its font, sprites,
# gamepads (and with them libudev), Bevy's clipboard, custom cursor images,
# FXAA/SMAA/TAA, HDR and PNG loading through the asset server, reflection
# auto-registration - and the tonemapping LUTs: every camera here draws with
# `camera::TONEMAPPING` (SomewhatBoringDisplayTransform), which needs none
# (owner's decision on #1576, 2026-11-08: 918 KB raw / 627 KB gzip).
bevy = { version = "0.20.1", default-features = false, features = [
    # The app frame.
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "std",
    "multi_threaded",
    "sysinfo_plugin",
    # Windowing and input, native and web.
    "bevy_winit",
    "bevy_window",
    "webgl2",
    "x11",
    "wayland",
    "keyboard",
    "mouse",
    # Rendering. `bevy_extract` is new in 0.20 (the render world's
    # extraction, which `bevy_render` and bevy_egui's renderer now sit on).
    "bevy_render",
    "bevy_extract",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_mesh",
    "bevy_mikktspace",
    "bevy_image",
    "bevy_shader",
    "bevy_material",
    "bevy_color",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_post_process",
    # FXAA, the WebGL2 build's edge smoothing (`camera::EdgeSmoothing`).
    "bevy_anti_alias",
    # Splines (swept prims, hulls and dressings): out of `bevy_math` in 0.20.
    "bevy_curve",
    # The render tool's and the editor's pointer rays.
    "bevy_picking",
    "mesh_picking",
    # Sound.
    "bevy_audio",
    "vorbis",
    "wav",
] }
# The sky light's environment maps are half floats (#1680); already in the
# graph through bevy_image, so this adds no crate.
half = "2"
# 0.43.1, not 0.43.0: that release broke egui's shader on wasm. No default
# features (#1576): its `bevy_ui` default would pull Bevy UI back in.
bevy_egui = { version = "0.43.1", default-features = false, features = [
    "manage_clipboard",
    "open_url",
    "default_fonts",
    "render",
    "picking",
] }
egui_ltreeview = "0.9"
# No "bevy_egui" feature: its focus gate is all-or-nothing and privately
# scheduled, which made right-drag dead over GUI windows. `camera.rs` owns
# the equivalent gate with a right-button override instead (#702).
bevy_panorbit_camera = "0.36"
bevy_symbios = "0.12"
bevy_symbios_ground = { version = "0.8", features = ["physics"] }
# Its default features stay off proto-blue-oauth's, without which our own
# line below cannot keep OpenSSL out of the graph (#1178). 0.8's public
# `auth::AtprotoSession.session` is a proto-blue-oauth 0.3 session, so the two
# proto-blue lines below move with it.
bevy_symbios_multiuser = "0.8"
bevy_symbios_texture = { version = "0.14", features = ["egui"] }
# The Bevy-free core, for its per-field texture registry: the mirrors in
# `pds::texture` are generated from it (#1304). `bevy_symbios_texture`
# re-exports the types, but a `$crate` path inside an exported macro
# resolves to the crate that declared it.
symbios-texture = "0.8"
bevy_symbios_audio = { version = "0.7", features = ["egui"] }
# Our copy of upstream 0.11.0's Bevy integration, ported to Bevy 0.20
# (crates/transform-gizmo-bevy, README there): upstream lags Bevy releases
# by months, and the Bevy upgrade (#1634) should not wait on it.
transform-gizmo-bevy = { path = "crates/transform-gizmo-bevy" }
symbios-avatar = "0.24"
symbios = "1.5"
symbios-turtle-3d = "0.7"
symbios-shape = "0.5"
bevy_symbios_shape = "0.11"
symbios-tensor = "0.7"
bevy_symbios_avatar = "0.26"
gen-jobs = { path = "crates/gen-jobs" }
# Geodata regions (#1580): where a region's square of Berlin lies, the
# GDI Berlin request URLs, and the decoders for what they answer. The app
# adds the fetching and the cache (`src/geodata`).
geodata = { path = "crates/geodata" }
# No default features (#1576): no debug renderer, no scene hierarchy colliders,
# no avian picking. 0.8 has no `f32` feature: `parry-f32` is the precision.
avian3d = { version = "0.8", default-features = false, features = [
    "3d",
    "parry-f32",
    "xpbd_joints",
    "parallel",
    "collider-from-mesh",
] }
fast-surface-nets = "0.2"
ndshape = "0.3"
serde = { version = "1.0", features = ["derive"] }
# Wall-clock chat timestamps (#846). Already in the tree transitively;
# `wasmbind` backs the clock + local timezone with JS Date on wasm32
# (std::time panics there - known gotcha).
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
# Only the decoders the app actually needs (#1153). Default features
# compile all sixteen - including exr, tiff, gif and the rav1e AV1
# encoder - and `decode_image_capped` sniffs format from magic bytes, so
# every compiled decoder is reachable from an untrusted PDS blob or peer
# avatar. The dimension cap bounds a pixel bomb, not decoder complexity.
# Features are additive across the graph, so bevy_image's own png/hdr/
# ktx2 still arrive; this is a pure subtraction of what nothing asks for.
# png also carries the encoder the render tool writes contact sheets with.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
futures-lite = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "1"
# Compact binary codec for the P2P reliable-message chunker (#716). Pinned to
# 1.3 to match the encoding `bevy_symbios_multiuser` already uses on the wire,
# so a chunked payload's measured size equals its true transmitted size.
bincode = "1.3"
rand_chacha = "0.9"
# Pure-Rust libm (#1132). The seeded derivation path must produce the same
# bits on a native peer and a browser peer, and `f32::cos`/`sin`/`powf` link
# whatever libm the target ships - glibc on x86-64, compiler-builtins on
# wasm32 - with results Rust documents as platform-dependent. Already in the
# lockfile transitively, so this is a direct edge on a crate we were shipping
# either way.
libm = "0.2"
# Without its default features (#1178). The default, `fetch-reqwest`, turns on
# reqwest's OWN defaults, and those carry `default-tls`: hyper-tls ->
# native-tls -> OpenSSL, linked into the native binary and preferred by
# reqwest at runtime over the rustls our reqwest line asks for. Nothing here
# needs it - every client and session we build is handed a
# `oauth::capped_fetch::CappedFetcher` (#1176), never proto-blue's default
# fetcher - and deny.toml now bans `openssl` outright, so an edge that turns
# the defaults back on goes red rather than quietly linking it again.
proto-blue-oauth = { version = "0.3", default-features = false }
# `FetchHandler` and its request/response types. Already in the graph under
# proto-blue-oauth, so this is a direct edge on a crate we were shipping
# either way. Direct rather than dev-only since #1176: the OAuth transport
# is now one of ours (`oauth::capped_fetch`) so that a response body is
# bounded before it is buffered - proto-blue's own `ReqwestFetcher` reads
# with `response.bytes()`, which has no ceiling. The refresh-dance tests
# (#1151) inject a scripted handler through the same seam.
proto-blue-common = "0.3"
# `FetchHandler` is declared with `#[async_trait]`, so implementing it needs
# the same macro.
async-trait = "0.1"
url = "2"
# The audio backend under Bevy's, and the WAV reader under it (both already in
# the graph, at the minors bevy_audio 0.20 builds, on the web build too): a
# fetched clip is built by the very decoder Bevy plays it with before any
# voice may, because Bevy unwraps that decoder and bytes that are not audio
# would crash every visitor (#1560); hound reads a WAV header first, since
# rodio divides by its sample rate. No features of our own, so the decoder is
# Bevy's to the byte. The master-mute test also builds real `AudioSink`s from
# a rodio `Player`, which Bevy does not re-export (#1341).
rodio = { version = "0.22", default-features = false }
hound = "3.5"
# The Ogg layer under lewton, Bevy's Vorbis decoder (also already in the
# graph, native and web): a fetched clip's Vorbis headers are walked from the
# very packets lewton will read, before lewton allocates from them (#1560).
ogg = "0.8"

[dev-dependencies]
glam = "0.33"
# Bevy's Vorbis decoder (already in the graph): the #1560 tests check that a
# crafted stream's identification header is one lewton accepts, so the
# hostile headers behind it would really be read.
lewton = "0.10"
# The font parser epaint 0.36 reads faces with (already in the graph): the
# UI glyph-coverage guard asks each bundled face's charmap directly, because
# epaint's `has_glyph` compares faces, not glyphs (#1105).
skrifa = "0.44"
# The web worker's codec (already in the graph, through gen-jobs): a built body
# is read back over msgpack as the browser reads it, so what crosses the worker
# is tested over the bytes it really crosses in (#1875).
rmp-serde = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The headless render tool's animated output (`--frames N`, `.gif`). `gif`
# is the encoder + decoder; `color_quant` is the NeuQuant palette fit behind
# the tool's own global-palette quantiser. Native-only like the tool itself:
# nothing on wasm writes a GIF.
gif = "0.14"
color_quant = "1.1"
tiny_http = "0.12"
# The shared HTTP runtime in `config.rs` is multi-threaded (several
# `IoTaskPool` workers block on it at once). Named here since 0.20's graph no
# longer brings the feature along; tokio's multi-threaded runtime does not
# build for wasm32, hence a native-only line beside the shared one.
tokio = { version = "1", features = ["rt-multi-thread"] }
webbrowser = "1.0"
arboard = "3"
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = [
    "Document",
    # `Document::pointer_lock_element`: whether the browser still holds the
    # pointer mouse look asked for (#1754).
    "Element",
    "Window",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlBodyElement",
    "Node",
    "Blob",
    "Url",
    "BlobPropertyBag",
    "Clipboard",
    "ClipboardEvent",
    "BeforeUnloadEvent",
    "EventTarget",
    "KeyboardEvent",
    "Navigator",
    "Storage",
    "Location",
    "History",
    # The browser's Cache API, where fetched geodata is kept between visits:
    # GDI Berlin answers `no-store`, so the HTTP cache keeps nothing (#1582).
    "CacheStorage",
    "Cache",
    "Response",
    "ResponseInit",
    "Headers",
] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
futures-channel = "0.3"
# `gloo-worker` is a direct dep so the `Spawnable` trait is in scope to spawn
# the worker; the worker type + impl live in `gen-worker` (slim, no Bevy).
gloo-worker = "0.6"
gen-worker = { path = "crates/gen-worker" }

[[bin]]
name = "symbios-overlands"
path = "src/main.rs"
test = false

# Headless contact-sheet renderer (`cargo run --bin render`).
[[bin]]
name = "render"
path = "src/bin/render.rs"
test = false

# The agent client (#1413): a headless Overlands client an AI agent drives
# from the command line, signed in as its own account
# (`cargo run --profile test-release --bin agent -- --help`). Unix-only.
[[bin]]
name = "agent"
path = "src/bin/agent.rs"
test = false

# The one integration-test target (#1179). Each `tests/*.rs` is a `mod` of
# `tests/main.rs`; nextest still runs every test in its own process, so
# parallelism and isolation are unchanged.
[[test]]
name = "integration"
path = "tests/main.rs"

[profile.release]
opt-level = "s"   # Optimize for size (helps wasm-bindgen)
lto = "fat"       # Enable full Link Time Optimization (CRITICAL FIX)
codegen-units = 1 # Reduce parallelism to improve optimization quality
strip = true      # Strip symbols to clean up the binary tables
panic = "abort"   # Reduce binary size by removing stack unwinding

# The profile the shipped app's wasm is built under (#1665): `release` with
# THIN LTO.
#
# Fat LTO merges the whole program into one LLVM module, and for the app that
# one rustc process peaked at 19.4 GB (measured 2026-10-16 with deploy.yml's
# own command) - past the 16 GB of the GitHub-hosted runner, where the deploy
# died with exit code 143, every attempt. Thin LTO peaked at 7.3 GB, and the
# deploy's two builds took 10 min against 14m41s. What it costs, after
# wasm-bindgen: the app's module is 12.7 % bigger raw (73.8 MB against
# 65.5 MB) and 1.6 % SMALLER gzipped (18.11 MB against 18.41 MB) - more for
# the browser to hold, less for it to download. The owner took that trade.
#
# Only the app. The gen-worker stays on `release`'s fat LTO, which is cheap
# without Bevy, and which thin would grow by 19.5 % raw and 5 % gzip. A
# profile's `lto` cannot be overridden per package, hence a profile of its own
# and two build commands in deploy.yml.
[profile.deploy]
inherits = "release"
lto = "thin"

# The profile the standing pre-commit gate runs under (#1064).
#
# `[profile.release]` above is tuned for ONE artifact: the wasm bundle
# `wasm-bindgen` ships. `cargo test --release` inherits it, and there are 24
# test binaries, each of which then pays a whole-program fat-LTO link of the
# entire Bevy engine at `codegen-units = 1` (i.e. single-threaded
# optimization), six at a time. Measured on the #1062 gate run: 2.0s of
# actual test execution behind roughly 25 minutes of linking, with
# `target/release/deps` at 5.8 GB.
#
# None of that optimization buys a test anything - the tests are gated on
# behaviour, not on code size or throughput - so this profile keeps release
# codegen (which is what makes the avatar/terrain builds in the suite
# tolerable) and drops the whole-program link.
#
# NOTE: `[profile.bench]` does NOT work here. Despite the folklore, cargo
# builds `--release` test targets with `profile.release`; a probe crate with
# `[profile.bench] lto = false` still emitted `-C lto=fat`. A custom profile
# is the only lever.
[profile.test-release]
inherits = "release"
lto = false        # the ~25 minutes: 24 whole-program Bevy links
codegen-units = 16 # was 1 - single-threaded optimization per binary
strip = false      # a failing gate should still print a legible backtrace
# Inheriting `release` turned BOTH of these off, so the gate the owner
# actually runs skipped every `debug_assert!` in the crate and let integer
# overflow wrap silently - while CI's plain `cargo test` ran them in debug
# (#1147). Two gates that disagree about what the code asserts is worse than
# one weak gate: the local one is the one that gets run, and the CI one is
# the one that gets doubted when they differ.
#
# Cheap at this opt-level, and the wasm deploy profile is untouched.
debug-assertions = true
overflow-checks = true
# A one-line edit recompiled in 89 s against 193, measured on this crate, and the
# suite ran no slower for it (68 s against 71). 7.2 GB of target/.
incremental = true
