[toolchain]
# A version, not a channel name (#1148).
#
# `stable` meant CI compiled with whatever rustc was newest while the local
# gate ran 1.96.1, so every six-week release could turn `clippy -D warnings`
# red with no code change and no way to reproduce it locally. The repo paid
# for that with seven clippy-only commits in eight weeks — pure churn in a
# history the catalogue and avatar notes are read back out of.
#
# Set to the version the local gate actually runs, so the two agree. Bump it
# deliberately: raise this line, run the gate, fix the new lints in one
# sweep. The `beta` job in ci.yml previews what the next bump will bring
# without blocking anything.
#
# CI reads THIS FILE via actions-rust-lang/setup-rust-toolchain rather than
# repeating the version in the workflow — a second copy of a pin is how the
# wasm-bindgen pin in deploy.yml drifted (#1152).
channel = "1.96.1"
components = ["rustfmt", "clippy", "rust-analyzer"]
