<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symbios Overlands</title>
    <meta name="theme-color" content="#1b1b1b">
    <meta property="og:title" content="Symbios Overlands">
    <meta property="og:description"
        content="A free and open creative virtual world - build yours, then walk into your friends'.">
    <!-- Inline SVG favicon: no extra asset to deploy, and the tab stops
         showing the 404 fallback icon (#850). -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1b1b1b;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        #loading {
            color: white;
            font-family: monospace;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            text-align: center;
            pointer-events: none;
        }

        .spinner {
            margin: 0 auto 16px auto;
            width: 40px;
            height: 40px;
            border: 4px solid #3a3a3a;
            border-top-color: #48c7d0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .wordmark {
            font-family: system-ui, sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.35em;
            color: #48c7d0;
            margin-bottom: 18px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading-progress {
            margin-top: 8px;
            font-size: 14px;
            color: #aaa;
        }

        #load-error {
            color: white;
            font-family: monospace;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 34em;
            text-align: center;
        }

        #load-error button,
        #loading-actions button {
            font: inherit;
            font-weight: 600;
            padding: 6px 24px;
            margin: 12px 0;
            cursor: pointer;
            background: #40bec8;
            color: #080808;
            border: none;
            border-radius: 4px;
        }

        #load-error button:hover,
        #loading-actions button:hover {
            background: #48c7d0;
        }

        /* #loading is pointer-events:none so it can never swallow a click
           meant for the canvas underneath. The stall escape hatch (#1228
           f13) is the one thing inside it a user must be able to press, so
           it opts back in. */
        #loading-actions {
            pointer-events: auto;
        }

        #loading-status.stalled {
            color: #e8b45a;
        }

        #load-error details {
            text-align: left;
            color: #aaa;
            font-size: 12px;
        }

        #load-error pre {
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
    <script>
        // Browser autoplay policy: an AudioContext starts suspended and may
        // only be resumed after a user gesture. cpal (Bevy -> rodio) creates
        // its context during wasm init -- before any gesture -- so it stays
        // suspended and no audio plays. Track every context the page creates,
        // then resume them on the first user interaction. This classic script
        // runs synchronously, ahead of the deferred module below, so the
        // constructor is patched before init() spins up the audio backend.
        (function () {
            const Original = window.AudioContext || window.webkitAudioContext;
            if (!Original) return;
            const contexts = [];
            function Tracked() {
                const ctx = new Original(...arguments);
                contexts.push(ctx);
                return ctx;
            }
            Tracked.prototype = Original.prototype;
            window.AudioContext = window.webkitAudioContext = Tracked;

            const resumeAll = () =>
                contexts.forEach(c => c.state === "suspended" && c.resume());
            // Not { once: true }: the context can be re-suspended when the tab
            // is backgrounded, so we resume again on the next interaction.
            ["pointerdown", "keydown", "touchend"].forEach(e =>
                window.addEventListener(e, resumeAll)
            );
        })();
    </script>
</head>

<body>
    <div id="loading">
        <div class="wordmark">SYMBIOS&nbsp;OVERLANDS</div>
        <div class="spinner"></div>
        <div id="loading-status">Loading…</div>
        <div id="loading-progress"></div>
        <div id="loading-actions" hidden>
            <button onclick="location.reload()">Reload</button>
        </div>
    </div>
    <div id="load-error" hidden>
        <div class="wordmark">SYMBIOS&nbsp;OVERLANDS</div>
        <p id="load-error-lead">Symbios Overlands couldn't start.</p>
        <p id="load-error-hint" style="font-size: 14px; color: #aaa;">This is usually a download
            hiccup or a stale cached version - reloading fixes most cases.</p>
        <button id="load-error-button" onclick="location.reload()">Reload</button>
        <details>
            <summary>Technical details</summary>
            <pre id="load-error-detail"></pre>
        </details>
    </div>
    <script type="module">
        // Which bundle this browser gets (#1670): the WebGPU one where the
        // browser hands out a WebGPU adapter, the WebGL2 one otherwise - one
        // wasm binary is one or the other, so the deploy builds both.
        //
        // `?renderer=webgl2` or `?renderer=webgpu` picks one and the page
        // remembers it; `?renderer=auto` forgets it. The parameter comes off
        // the address as it is read: sign-in and landmark links rewrite the
        // address, so a choice kept only there would not survive them.
        //
        // A WebGPU bundle whose graphics fail notes when, under
        // WEBGPU_FAILED_KEY (diagnostics::crash_log), and raises the card,
        // whose Reload then lands here and takes WebGL2 - for a week, after
        // which WebGPU gets another try. A machine whose WebGPU cannot draw
        // the world is well again after one reload, where it would otherwise
        // fail the same way on every one. A lost device's card (#1720,
        // watchDeviceLoss below) opens a new tab instead, which lands here
        // the same way: the tab that lost it may draw nothing again.
        const BUNDLES = {
            webgl2: { js: './symbios-overlands.js', wasm: './symbios-overlands_bg.wasm' },
            webgpu: { js: './symbios-overlands-webgpu.js', wasm: './symbios-overlands-webgpu_bg.wasm' },
        };
        const RENDERER_KEY = 'overlands.renderer';
        const WEBGPU_FAILED_KEY = 'overlands.webgpu-failed';
        const WEBGPU_RETRY_MS = 7 * 24 * 60 * 60 * 1000;
        // Storage can be switched off or full: a choice that cannot be kept
        // still decides this load.
        function recall(key) {
            try { return localStorage.getItem(key); } catch { return null; }
        }
        function remember(key, value) {
            try {
                if (value === null) localStorage.removeItem(key);
                else localStorage.setItem(key, value);
            } catch { /* see recall */ }
        }
        // The bundle, and why - the console line is what a bug report about
        // the renderer needs first.
        async function pickRenderer() {
            const url = new URL(location.href);
            const asked = url.searchParams.get('renderer');
            if (asked !== null) {
                url.searchParams.delete('renderer');
                history.replaceState(history.state, '', url.href);
                // Any ask starts afresh: asking for WebGPU is how to retry
                // it inside the week.
                remember(WEBGPU_FAILED_KEY, null);
                if (asked === 'webgl2' || asked === 'webgpu') {
                    remember(RENDERER_KEY, asked);
                    return [asked, 'asked for'];
                }
                remember(RENDERER_KEY, null);
            }
            const kept = recall(RENDERER_KEY);
            if (kept === 'webgl2') return ['webgl2', 'asked for earlier'];
            const failedAt = Number(recall(WEBGPU_FAILED_KEY)) || 0;
            if (Date.now() - failedAt < WEBGPU_RETRY_MS) {
                return ['webgl2', 'WebGPU failed here at ' + new Date(failedAt).toISOString()];
            }
            if (kept === 'webgpu') return ['webgpu', 'asked for earlier'];
            if (!navigator.gpu) return ['webgl2', 'no WebGPU in this browser'];
            try {
                // An adapter request can hang on a broken driver stack; a
                // working one answers well inside two seconds.
                const adapter = await Promise.race([
                    navigator.gpu.requestAdapter(),
                    new Promise(resolve => setTimeout(() => resolve(null), 2000)),
                ]);
                return adapter ? ['webgpu', 'a WebGPU adapter'] : ['webgl2', 'no WebGPU adapter'];
            } catch {
                return ['webgl2', 'the WebGPU adapter request failed'];
            }
        }

        // Right-drag orbits the camera in-game; without this the browser
        // context menu opens on every release. Load-bearing - keep.
        document.addEventListener('contextmenu', event => event.preventDefault());

        const progressEl = document.getElementById('loading-progress');
        const statusEl = document.getElementById('loading-status');
        const actionsEl = document.getElementById('loading-actions');
        const mib = bytes => (bytes / (1024 * 1024)).toFixed(1);

        // The bundle download is the longest and least reliable step of the
        // browser journey, and a stalled TCP stream does not reject - it
        // simply stops yielding chunks, so #850's byte counter turned a
        // silent wait into a visibly stuck one with no way out (#1228 f13).
        // Every chunk rearms this; if none arrives for STALL_MS the status
        // line says so and the Reload button appears.
        const STALL_MS = 20000;
        let stallTimer = null;
        function armStallWatch() {
            clearTimeout(stallTimer);
            // Bytes after a stall mean the connection came back: retract the
            // accusation rather than leaving an amber line over a counter
            // that is visibly climbing again.
            if (statusEl.classList.contains('stalled')) {
                statusEl.classList.remove('stalled');
                statusEl.textContent = 'Loading…';
                actionsEl.hidden = true;
            }
            stallTimer = setTimeout(() => {
                statusEl.textContent = 'Download stalled - check your connection';
                statusEl.classList.add('stalled');
                actionsEl.hidden = false;
            }, STALL_MS);
        }
        function disarmStallWatch() {
            clearTimeout(stallTimer);
            stallTimer = null;
        }

        // One card for every way this page can fail to become an app, so the
        // Rust side can use it too (#1228 f4). A panic after init() returns
        // leaves a dead canvas that no JS promise ever hears about, and the
        // panic hook in diagnostics::crash_log calls this by name. The first
        // card stands: the first failure is the one to report, and a later
        // call - the renderer's handler after the page's own answer to a
        // lost device (#1720) - must not pair its words with that card's
        // button. The canvas goes: a dead app's keeps its last frame, which
        // the card's words would sit over.
        window.__overlandsShowError = function (lead, hint, detail) {
            const card = document.getElementById('load-error');
            if (!card.hidden) return false;
            disarmStallWatch();
            document.getElementById('loading').style.display = 'none';
            for (const canvas of document.querySelectorAll('canvas')) {
                canvas.style.visibility = 'hidden';
            }
            if (lead) document.getElementById('load-error-lead').textContent = lead;
            if (hint) document.getElementById('load-error-hint').textContent = hint;
            document.getElementById('load-error-detail').textContent = detail || '';
            card.hidden = false;
            return true;
        };

        // A lost WebGPU device raises the card from here too (#1720). The
        // renderer's own error handler (diagnostics::crash_log) answers a
        // lost device on the next frame, but Firefox 158 loses its device to
        // an out-of-memory at startup and then gives the tab no more
        // animation frames: the app never sees another one, and the tab sat
        // on its last - the sign-in over an empty sky - with no card and no
        // way to WebGL 2. The device's `lost` promise settles all the same,
        // so the page answers it: raises the handler's card and notes the
        // failure under WEBGPU_FAILED_KEY as the handler does - only where
        // this card is the one raised, since a card already up has answered
        // for its own failure. Not the card's Reload: the tab stays frozen
        // through a reload, WebGL 2 or not, where a new tab - which reads
        // the note and takes WebGL 2 - draws; and a new tab opened by the
        // button, in the same Firefox, drew as well. A device destroyed on
        // purpose is no failure (nothing here destroys one), and nor is one
        // lost once the page is going away - a reload, a sign-in's redirect -
        // which must not send a healthy machine to WebGL 2 for a week.
        const WEBGPU_FAILED_LEAD = 'WebGPU failed in this browser.';
        const DEVICE_LOST_HINT = 'This tab can no longer draw. Open Symbios Overlands in a new tab to continue with WebGL 2 instead. The technical details below are worth including if you report it.';
        let leaving = false;
        addEventListener('pagehide', () => { leaving = true; });
        function watchDeviceLoss() {
            if (typeof GPUAdapter === 'undefined') return;
            const requestDevice = GPUAdapter.prototype.requestDevice;
            GPUAdapter.prototype.requestDevice = async function (...args) {
                const device = await requestDevice.apply(this, args);
                device.lost.then(info => {
                    if (leaving || info.reason === 'destroyed') return;
                    const raised = window.__overlandsShowError(WEBGPU_FAILED_LEAD, DEVICE_LOST_HINT,
                        'The WebGPU device was lost (' + info.reason + '): ' + info.message);
                    if (!raised) return;
                    remember(WEBGPU_FAILED_KEY, String(Date.now()));
                    const button = document.getElementById('load-error-button');
                    button.textContent = 'Open in a new tab';
                    // A blocked pop-up opens nothing: a reload is still a try.
                    button.onclick = () => window.open(location.href, '_blank') || location.reload();
                });
                return device;
            };
        }

        // Fetch the .wasm ourselves so the multi-MB download shows live
        // byte progress instead of a static "Loading..." (#850). The
        // wrapped Response keeps the original headers (instantiateStreaming
        // needs the application/wasm content-type) while the tee'd stream
        // counts decoded bytes.
        async function fetchWasmWithProgress(url) {
            armStallWatch();
            const resp = await fetch(url);
            if (!resp.ok) {
                throw new Error('wasm download failed: HTTP ' + resp.status + ' for ' + url);
            }
            if (!resp.body || typeof ReadableStream === 'undefined') {
                // Ancient browser: no progress, still correct - and nothing
                // to rearm the watch, so a slow-but-healthy download must
                // not be accused of stalling.
                disarmStallWatch();
                return resp;
            }
            // Probe Response-from-stream support BEFORE consuming the body -
            // once getReader() runs the original response can't be reused,
            // so an unsupported browser must bail out here, not throw later.
            try {
                new Response(new ReadableStream());
            } catch {
                disarmStallWatch();
                return resp;
            }
            // Content-Length is the *encoded* (gzip/brotli) size while the
            // reader yields decoded bytes, so only trust it for a percentage
            // when the transfer is identity-encoded. Otherwise show plain MiB.
            const encoding = resp.headers.get('Content-Encoding');
            const lengthHeader = resp.headers.get('Content-Length');
            const total = (!encoding || encoding === 'identity') && lengthHeader
                ? parseInt(lengthHeader, 10) : 0;
            let received = 0;
            const reader = resp.body.getReader();
            const counted = new ReadableStream({
                async pull(controller) {
                    const { done, value } = await reader.read();
                    if (done) {
                        disarmStallWatch();
                        progressEl.textContent = 'Starting…';
                        controller.close();
                        return;
                    }
                    received += value.byteLength;
                    armStallWatch();
                    progressEl.textContent = total
                        ? mib(received) + ' MiB of ' + mib(total) + ' MiB ('
                            + Math.floor(100 * received / total) + '%)'
                        : mib(received) + ' MiB downloaded';
                    controller.enqueue(value);
                },
                cancel(reason) { disarmStallWatch(); return reader.cancel(reason); }
            });
            return new Response(counted, {
                status: resp.status,
                statusText: resp.statusText,
                headers: resp.headers,
            });
        }

        function showError(e) {
            console.error('Failed to initialize:', e);
            window.__overlandsShowError(null, null, (e && (e.stack || e.message)) || String(e));
        }

        async function run() {
            try {
                const [renderer, why] = await pickRenderer();
                console.info('renderer: ' + renderer + ' (' + why + ')');
                if (renderer === 'webgpu') watchDeviceLoss();
                const bundle = BUNDLES[renderer];
                const { default: init } = await import(bundle.js);
                try {
                    await init({ module_or_path: fetchWasmWithProgress(bundle.wasm) });
                } catch (e) {
                    // winit's wasm backend historically unwinds init() with a
                    // "using exceptions for control flow" throw that is NOT a
                    // failure - never show it as one.
                    if (e && String(e).toLowerCase().includes('control flow')) {
                        console.debug('init unwound via control-flow exception (benign)');
                    } else {
                        throw e;
                    }
                }
                disarmStallWatch();
                document.getElementById('loading').style.display = 'none';
            } catch (e) {
                showError(e);
            }
        }
        run();
    </script>
</body>

</html>
