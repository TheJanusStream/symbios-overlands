name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Pinned rather than `ubuntu-latest` (#1665): that label moves to Ubuntu 26
    # from 2026-10-19, and a new image landing while the build's memory was
    # being brought back under the runner's would confound the two. Move it on
    # purpose.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pinned version out of rust-toolchain.toml (#1181), the same
      # way ci.yml's wasm job does. `dtolnay/rust-toolchain@stable` does not:
      # it installed the newest stable and added wasm32 to THAT, and then
      # cargo, running in a directory carrying a `rust-toolchain.toml`, took
      # the pinned 1.96.1 instead - a toolchain that had the pin's components
      # and no wasm32 target at all. The build then failed on `can't find
      # crate for core`, whose own hint ("the target may not be installed")
      # is true and points at the wrong step. #1148 moved ci.yml onto this
      # action and left deploy.yml behind; it broke on the next deploy.
      #
      # `cache: false` keeps this step doing exactly what the old one did.
      # Unlike ci.yml there is no `Swatinem/rust-cache` after it here, so
      # deploy has never cached anything - turning that on is a separate
      # decision, not a side effect of fixing the toolchain.
      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: false

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Show resolved wasm-bindgen
        # Prints the crate version beside the CLI version above, so a
        # mismatch is legible in the log BEFORE wasm-bindgen errors out on
        # a schema it does not recognise.
        run: cargo tree -i wasm-bindgen --target wasm32-unknown-unknown --depth 0

      # Swap as headroom for the build (#1665). The app's fat-LTO link peaked
      # at 19.4 GB in one process on this 16 GB runner, and the deploy died
      # with exit code 143 on every attempt. The app now links thin (7.3 GB,
      # see Cargo.toml's [profile.deploy]), so this is margin, not the fix:
      # it is added BESIDE whatever swap the image carries, and failing to add
      # it only warns. The first lines log what the runner has.
      - name: Add swap
        run: |
          free -h
          swapon --show || true
          df -h / /mnt || true
          if sudo fallocate -l 16G /mnt/build-swap \
              && sudo chmod 600 /mnt/build-swap \
              && sudo mkswap /mnt/build-swap > /dev/null \
              && sudo swapon /mnt/build-swap; then
            free -h
          else
            echo "::warning::could not add swap at /mnt/build-swap; building without it"
          fi

      - name: Build WASM (app + gen-worker)
        # Two commands, two profiles (#1665): the gen-worker - the slim,
        # no-Bevy off-thread generation Web Worker - under `release`'s fat
        # LTO, and the app under `deploy`'s thin LTO, because a profile's LTO
        # cannot be set per package. Cargo.toml's [profile.deploy] has why.
        #
        # The runner's memory is sampled while it builds: a line a minute, so
        # a run the runner kills still shows the climb in its log, and the
        # peak at the end, warned past 12 GB - three quarters of the runner's
        # 16 GB - the way the size report below catches growth before it
        # fails. Measured locally on 2026-10-16, the dependencies peak under
        # 8 GB across six parallel compiles and the app's thin link at 7.3 GB.
        run: |
          set -euo pipefail
          mem() {
            awk '/^MemTotal:/ {t = $2} /^MemAvailable:/ {a = $2}
                 /^SwapTotal:/ {st = $2} /^SwapFree:/ {sf = $2}
                 END {printf "%d %d\n", (t - a) / 1024, (st - sf) / 1024}' /proc/meminfo
          }
          log="$RUNNER_TEMP/build-mem.log"
          : > "$log"
          (
            n=0
            while sleep 5; do
              read -r ram swap < <(mem)
              echo "$ram $swap" >> "$log"
              n=$((n + 1))
              if [ $((n % 12)) -eq 0 ]; then
                echo "memory: ${ram} MB used, ${swap} MB swap"
              fi
            done
          ) &
          sampler=$!
          report() {
            kill "$sampler" 2> /dev/null || true
            peak_ram=$(sort -n -k1,1 "$log" | tail -1 | cut -d' ' -f1)
            peak_swap=$(sort -n -k2,2 "$log" | tail -1 | cut -d' ' -f2)
            echo "peak memory: ${peak_ram:-0} MB used, ${peak_swap:-0} MB swap"
            if [ "${peak_ram:-0}" -gt 12000 ]; then
              echo "::warning::the build peaked at ${peak_ram} MB of the runner's 16 GB"
            fi
          }
          trap report EXIT
          cargo build -p gen-worker --release --target wasm32-unknown-unknown
          cargo build -p symbios-overlands --bin symbios-overlands --profile deploy \
            --target wasm32-unknown-unknown

      - name: Generate JS Bindings
        run: |
          wasm-bindgen --out-dir ./dist --target web \
            --out-name symbios-overlands \
            --no-typescript \
            target/wasm32-unknown-unknown/deploy/symbios-overlands.wasm
          # The off-thread generation worker the app spawns via gloo-worker as
          # "./gen-worker.js" (sits beside the app JS in ./dist).
          wasm-bindgen --out-dir ./dist --target web \
            --out-name gen-worker \
            --no-typescript \
            target/wasm32-unknown-unknown/release/gen-worker.wasm

      # No wasm-opt step, and no Binaryen download to feed one (#1149).
      #
      # Binaryen had been fetched on every deploy since the scaffold commit
      # to run a `wasm-opt -Oz` step that was commented out the whole time,
      # on the assumption it would take a further 10-20% off the download.
      # Measured locally against binaryen 130 and this release profile, it
      # does not - the app's transfer size gets BIGGER:
      #
      #                      raw          gzip -9      brotli -11
      #   app        60.7 MB -> 51.2 MB   -0.79%       +2.18%
      #   gen-worker  3.41 MB -> 3.09 MB  +4.90%       +4.42%
      #
      # -Oz shrinks the module by restructuring code into forms that
      # compress worse, and every browser fetching this site gets it
      # compressed. So the raw column is a real saving in decoded module
      # bytes (9.5 MB less for the browser to hold), bought with ~226 KB
      # more on the wire per page load, against a boot download that is
      # already the recorded pain point (#850, #1063). That is a trade for
      # whoever owns the deploy to make deliberately, not a free win to
      # switch on - so it stays off, and the numbers stay here so the next
      # person to read the commented-out step does not have to re-measure.
      #
      # What the step below adds is the half that was unambiguously
      # missing: a printed size per artifact. `du -sh ./dist` is dominated
      # by 16.7 MB of CJK fonts and could not have shown any of this.

      - name: Assemble Site
        run: |
          cp index.html ./dist/
          cp -r assets ./dist/
          cp assets/client-metadata.json ./dist/

      - name: Clean up dist for deployment
        run: |
          find ./dist -type l -delete
          du -sh ./dist

      - name: Report wasm bundle sizes
        # Raw and compressed bytes per .wasm artifact (#1149). Raw is what
        # the browser holds and compiles; gzip approximates what it
        # downloads. Both are printed because a change can move them in
        # opposite directions - see the note above the Assemble step, where
        # exactly that happened.
        #
        # The budgets are soft ceilings a few percent above the sizes
        # measured when each was last set (see its line), not targets: they
        # exist so a dependency bump or a feature-flag change that adds
        # megabytes fails the deploy instead of landing unremarked, which is
        # how the app reached 57.9 MB raw without anyone noticing. Raising
        # one is fine - raising it in the same commit as the change that
        # needed it is the point.
        run: |
          set -euo pipefail
          fail=0
          check() {
            local file="$1" raw_budget="$2" gz_budget="$3"
            local raw gz
            raw=$(stat -c %s "$file")
            gz=$(gzip -9c "$file" | wc -c)
            # Bash integer arithmetic rather than `bc`: this step is the
            # deploy's own gate, so it must not be able to fail on a tool the
            # runner image might not carry. Hundredths of a MB by hand.
            printf '%-30s raw %10d B (%d.%02d MB)  gzip %10d B (%d.%02d MB)\n' \
              "$(basename "$file")" \
              "$raw" "$((raw / 1048576))" "$(((raw % 1048576) * 100 / 1048576))" \
              "$gz" "$((gz / 1048576))" "$(((gz % 1048576) * 100 / 1048576))"
            if [ "$raw" -gt "$raw_budget" ]; then
              echo "::error::$(basename "$file") raw $raw B exceeds the $raw_budget B budget"
              fail=1
            fi
            if [ "$gz" -gt "$gz_budget" ]; then
              echo "::error::$(basename "$file") gzip $gz B exceeds the $gz_budget B budget"
              fail=1
            fi
          }
          # app:        57.9 MB raw / 15.95 MB gzip on 2026-08-29
          #             64,918,671 B raw / 18,207,498 B gzip on 2026-10-10,
          # measured locally with this file's own build and wasm-bindgen:
          # the Berlin regions (#1580-#1599, 64,497,004 / 18,112,490 B
          # before #1600) and their 48 detached houses and halls (#1600,
          # +421,667 / +95,008 B, about 70 % of the gzip their grammars'
          # text) took it past 18,000,000 gzip. Raised to about 5 % above.
          # The Bevy feature trim (#1576) measured -12 % gzip, should the
          # room be wanted back.
          #             73,792,874 B raw / 18,114,793 B gzip on 2026-10-16,
          # when the app moved to thin LTO (#1665, Cargo.toml's
          # [profile.deploy]): 12.7 % more raw and 1.6 % less gzip than the
          # fat-LTO 65,495,625 / 18,409,375 B of the same commit. The raw
          # budget raised to about 5 % above; the gzip one already was.
          check ./dist/symbios-overlands_bg.wasm 77500000 19000000
          # gen-worker:  3.25 MB raw /  0.68 MB gzip on 2026-08-29
          #              3.57 MB raw /  0.80 MB gzip on 2026-09-22, after the
          # outfit textures (#1403). Measured locally, that commit added
          # 355 KB raw / 99 KB gzip, about three quarters of it serde code
          # for the 35 texture configs' wire format, which crosses the worker
          # boundary inside the avatar record (#1406).
          #              3,916,966 B raw / 870,443 B gzip on 2026-10-10
          # (98 % / 97 % of the budget, left as it was: nothing needed it).
          #              3,916,966 B raw / 870,443 B gzip on 2026-10-16, built
          # alone under fat LTO when the app moved to thin (#1665): the same
          # bytes as 10-10. Built with `--workspace` it had been 3,935,400 /
          # 879,688 B, the app's dependency features unified into its own.
          check ./dist/gen-worker_bg.wasm 4000000 900000
          exit $fail

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Check dist for links and size
        run: |
          echo "Size of dist:"
          du -sh ./dist || true
          echo "Listing symlinks (if any):"
          SYMLINKS=$(find ./dist -type l -print)
          if [ -n "$SYMLINKS" ]; then
            echo "Symlinks found:"
            echo "$SYMLINKS"
          else
            echo "No symlinks found."
          fi
          echo "Listing files with link count >1 (possible hard links):"
          HARDLINKS=$(find ./dist -type f -links +1 -printf '%p (%n links)\n')
          if [ -n "$HARDLINKS" ]; then
            echo "Hard links found:"
            echo "$HARDLINKS"
          else
            echo "No hard links found."
          fi
          if [ -n "$SYMLINKS" ] || [ -n "$HARDLINKS" ]; then
            echo "Remove or dereference symlinks/hardlinks before uploading."
            exit 1
          fi

      - name: Upload Pages artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with: 
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4